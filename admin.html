        // HTML5 Canvas Image Compression (High Quality)
        function compressAndResizeImage(file, maxWidth = 1400, quality = 0.88) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
                reader.onerror = (error) => reject(error);
            });
        }

                            </div>
                        </div>
                        <button class="btn-delete" id="del-prod-${key}">Ջնջել</button>
                    </div>
                `;
            });
            Object.keys(data).forEach(key => {
                document.getElementById(`del-prod-${key}`)?.addEventListener('click', () => {
                    const prod = data[key];
                    // Ավտոմատ ջնջում ենք նկարը Storage-ից, որ տեղ չզբաղեցնի
                    if (prod.storageId) {
                        const fileRef = sRef(storage, `products/${prod.storageId}.jpg`);

                    remove(ref(db, `products/${key}`));
                });
            });
        });

        document.getElementById('addProductBtn').addEventListener('click', async () => {
            const title = document.getElementById('prodTitle').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const brand = document.getElementById('prodBrand').value.trim();
            const ml = document.getElementById('prodMl').value.trim();
            const gender = document.getElementById('prodGender').value;

            if(title && price && brand && ml && fileInput.files.length > 0) {
                prodLoading.style.display = 'block';

                const compressedBase64 = await compressAndResizeImage(file, 900, 0.88);

                const imageId = Date.now();
                const storageReference = sRef(storage, `products/${imageId}.jpg`);

                // Ուղարկում ենք ֆայլը Storage
                uploadString(storageReference, compressedBase64, 'data_url').then((snapshot) => {
                    getDownloadURL(snapshot.ref).then((downloadURL) => {
                        
                        // Պահում ենք բազայում կարճ հղումը և բոլոր նոր տվյալները
                        const newProdRef = push(productsRef);
                        set(newProdRef, { 
                            title, 
                            price: Number(price), 
                            brand, 
                            ml, 
                            gender, 
                            img: downloadURL,
                            storageId: imageId 
                        }).then(() => {
                            document.getElementById('prodTitle').value = '';
                            document.getElementById('prodPrice').value = '';
                            document.getElementById('prodBrand').value = '';
                            document.getElementById('prodMl').value = '';
                            fileInput.value = '';
                            prodLoading.style.display = 'none';
                        });
                    });
                });
            } else { alert('Խնդրում ենք լրացնել բոլոր դաշտերը և ընտրել նկար։'); }

        const ordersRef = ref(db, 'orders');

                });

        // Tabs Toggle Logic

        tabButtons.forEach(btn => {

            const brand = document.getElementById('prodBrand').value;
            const gender = document.getElementById('prodGender').value;
            const file = document.getElementById('prodFileInput').files[0];

            if(title && optionsInput && file) {
                document.getElementById('prodLoading').style.display = 'block';
                const optionsArray = optionsInput.split(',').map(item => {
                    const [ml, price] = item.split(':');
                    return { ml: Number(ml.trim()), price: Number(price.trim()) };
                });
                
                const compressed = await compressAndResizeImage(file);
                const imageId = Date.now();
                const storageRef = sRef(storage, `products/${imageId}.jpg`);

                uploadString(storageRef, compressed, 'data_url').then(async (snapshot) => {
                    const url = await getDownloadURL(snapshot.ref);
                    push(productsRef).set({ title, options: optionsArray, brand, gender, img: url, storageId: imageId });
                    document.getElementById('prodLoading').style.display = 'none';
                    alert('Հաջողությամբ ավելացված է!');
                });
            } else { alert('Լրացրու բոլոր դաշտերը!'); }
        });

        // Tabs Toggle (նույնը)
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        // (Slider-ի և Order-ների կոդը թողնում ես այնպես, ինչպես կար՝ ես դրանք չփոխեցի)
    </script>
</body>
</html>
