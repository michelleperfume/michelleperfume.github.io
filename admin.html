<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle Perfume | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <style>
        select.form-input { width: 100%; padding: 12px 15px; border: 1px solid var(--color-border, #EAEAEC); border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; background: white; cursor: pointer; }
        select.form-input:focus { border-color: #000; }
        .item-details-preview { font-size: 12px; color: #666; margin-top: 5px; line-height: 1.4; }
        .loading-text { font-size: 14px; color: #007bff; font-weight: 600; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">Michelle <span>Admin</span></div>
        <ul class="admin-menu">
            <li><a href="#" class="tab-btn active" data-tab="slider-tab">Գլխավոր Սլայդեր</a></li>
            <li><a href="#" class="tab-btn" data-tab="products-tab">Ապրանքներ (Cards)</a></li>
            <li><a href="#" class="tab-btn" data-tab="orders-tab">Պատվերներ <span id="orders-badge" class="badge">0</span></a></li>
        </ul>
        <a href="index.html" class="back-to-site">← Դեպի կայք</a>
    </aside>

    <main class="admin-content">
        <div id="slider-tab" class="tab-content active">
            <header class="admin-header"><h1>Կառավարել Սլայդերը</h1></header>
            <div class="add-box">
                <input type="file" id="sliderFileInput" accept="image/*" style="padding: 8px;">
                <button id="addSliderBtn" class="btn-dark">Ավելացնել Սլայդերում</button>
            </div>
            <p id="sliderLoading" class="loading-text">Նկարը մշակվում և բեռնվում է...</p>
            <div class="grid-list" id="adminSliderList"></div>
        </div>

        <div id="products-tab" class="tab-content">
            <header class="admin-header"><h1>Ապրանքների Կատալոգ</h1></header>
            <div class="add-product-form">
                <h3>Ավելացնել նոր ապրանք</h3>
                <div class="form-group">
                    <input type="text" id="prodTitle" placeholder="Ապրանքի անվանումը...">
                    <input type="text" id="prodBrand" placeholder="Բրենդ...">
                </div>
                <div class="form-group">
                    <input type="number" id="prodMl" placeholder="Բազային ծավալ (մլ) օր.՝ 100" style="width: 50%;">
                    <input type="number" id="prodPrice" placeholder="Գին (AMD) օր.՝ 15000" style="width: 50%;">
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <input type="text" id="prodSizes" placeholder="Հնարավոր ծավալները ստորակետով՝ 30,45,100...">
                </div>
                <div class="form-group">
                    <select id="prodGender" class="form-input">
                        <option value="Unisex">Unisex</option>
                        <option value="Տղամարդու">Տղամարդու</option>
                        <option value="Կանացի">Կանացի</option>
                    </select>
                    <input type="file" id="prodFileInput" accept="image/*" style="padding: 8px;">
                </div>
                <button id="addProductBtn" class="btn-dark" style="margin-top: 15px;">Ավելացնել Կատալոգում</button>
                <p id="prodLoading" class="loading-text">Ապրանքը բեռնվում է...</p>
            </div>
            <div class="grid-list" id="adminProductsList"></div>
        </div>

        <div id="orders-tab" class="tab-content">
            <header class="admin-header"><h1>Ստացված Պատվերներ</h1></header>
            <div class="orders-container" id="adminOrdersList"></div>
        </div>
    </main>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDV1eNX6JkMgHMT9srENH-Hpns4NoxCYLI",
        authDomain: "michelle-1d1a8.firebaseapp.com",
        databaseURL: "https://michelle-1d1a8-default-rtdb.firebaseio.com",
        projectId: "michelle-1d1a8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Իմիջի կոմպրեսիա (Վերադարձնում է Base64 տեքստ)
    function compressAndResizeImage(file, maxWidth = 800, quality = 0.80) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality)); // Սա դառնում է տեքստ
                };
            };
        });
    }

    // --- Սլայդերի կոդ ---
    const sliderRef = ref(db, 'slider');
    onValue(sliderRef, (snapshot) => {
        const data = snapshot.val() || {};
        const list = document.getElementById('adminSliderList');
        list.innerHTML = '';
        Object.keys(data).forEach(key => {
            const item = data[key];
            list.innerHTML += `<div class="item-card"><img src="${item.img}" width="80"><button class="btn-delete" id="del-s-${key}">Ջնջել</button></div>`;
        });
        Object.keys(data).forEach(key => {
            document.getElementById(`del-s-${key}`)?.addEventListener('click', () => {
                remove(ref(db, `slider/${key}`));
            });
        });
    });

    document.getElementById('addSliderBtn').addEventListener('click', async () => {
        const file = document.getElementById('sliderFileInput').files[0];
        if(file) {
            document.getElementById('sliderLoading').style.display = 'block';
            const base64Img = await compressAndResizeImage(file, 1200, 0.75); // Սլայդերը մի քիչ մեծ
            
            // Պահում ենք ուղիղ Realtime Database-ում
            push(sliderRef, { img: base64Img }).then(() => {
                document.getElementById('sliderLoading').style.display = 'none';
                document.getElementById('sliderFileInput').value = '';
            });
        }
    });

    // --- Ապրանքների կոդ ---
    const productsRef = ref(db, 'products');
    onValue(productsRef, (snapshot) => {
        const data = snapshot.val() || {};
        const list = document.getElementById('adminProductsList');
        list.innerHTML = '';
        Object.keys(data).forEach(key => {
            const p = data[key];
            // Ցուցադրում ենք նաև ներմուծված չափսերը ադմինի preview-ում
            const sizesPreview = p.sizes ? p.sizes.join(', ') + ' մլ' : 'Չկա';
            list.innerHTML += `
                <div class="item-card">
                    <img src="${p.img}" width="80">
                    <div class="item-info">
                        <h4>${p.title}</h4>
                        <p>${p.brand} [${p.gender || 'Unisex'}]</p>
                        <div class="item-details-preview"><b>Բազային արժեք:</b> ${p.ml}մլ = ${p.price} AMD</div>
                        <div class="item-details-preview"><b>Բոլոր չափսերը:</b> ${sizesPreview}</div>
                    </div>
                    <button class="btn-delete" id="del-prod-${key}">Ջնջել</button>
                </div>`;
        });
        Object.keys(data).forEach(key => {
            document.getElementById(`del-prod-${key}`)?.addEventListener('click', () => {
                remove(ref(db, `products/${key}`));
            });
        });
    });

    document.getElementById('addProductBtn').addEventListener('click', async () => {
        const title = document.getElementById('prodTitle').value.trim();
        const brand = document.getElementById('prodBrand').value.trim();
        const ml = document.getElementById('prodMl').value.trim();
        const price = document.getElementById('prodPrice').value.trim();
        const sizesRaw = document.getElementById('prodSizes').value.trim();
        const gender = document.getElementById('prodGender').value;
        const file = document.getElementById('prodFileInput').files[0];

        if(title && brand && ml && price && sizesRaw && file) {
            document.getElementById('prodLoading').style.display = 'block';
            const base64Img = await compressAndResizeImage(file, 600, 0.80); // Ապրանքի նկարը ավելի փոքր
            
            // Ստորակետով տեքստը սարքում ենք թվերի մաքուր զանգված (Array)
            const sizesArray = sizesRaw.split(',').map(s => Number(s.trim())).filter(s => !isNaN(s) && s > 0);

            // Պահում ենք ուղիղ Realtime Database-ում
            push(productsRef, { 
                title, 
                brand, 
                ml: Number(ml), 
                price: Number(price), 
                sizes: sizesArray, // Նոր զանգվածը ավելացավ օբյեկտի մեջ
                gender, 
                img: base64Img 
            }).then(() => {
                document.getElementById('prodLoading').style.display = 'none';
                document.getElementById('prodTitle').value = '';
                document.getElementById('prodBrand').value = '';
                document.getElementById('prodMl').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodSizes').value = '';
                document.getElementById('prodFileInput').value = '';
            });
        } else { alert('Լրացրու բոլոր դաշտերը (ներառյալ չափսերը ստորակետով) և ընտրիր նկարը!'); }
    });

    // --- Պատվերներ ---
    const ordersRef = ref(db, 'orders');
    onValue(ordersRef, (snapshot) => {
        const data = snapshot.val() || {};
        const list = document.getElementById('adminOrdersList');
        document.getElementById('orders-badge').innerText = Object.keys(data).length;
        list.innerHTML = '';
        Object.keys(data).forEach(key => {
            const o = data[key];
            list.innerHTML += `
                <div class="order-card" style="border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #fff;">
                    <p style="margin: 0 0 5px 0;"><b>Հաճախորդ:</b> ${o.name} (${o.phone})</p>
                    <p style="margin: 0 0 5px 0; color: #555;"><b>Պատվեր:</b> ${o.items}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <b style="color: #000; font-size: 16px;">${o.total} AMD</b>
                        <button class="btn-complete" id="del-o-${key}" style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Ավարտել</button>
                    </div>
                </div>`;
        });
        Object.keys(data).forEach(key => {
            document.getElementById(`del-o-${key}`)?.addEventListener('click', () => remove(ref(db, `orders/${key}`)));
        });
    });

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });
</script>
   
</body>
</html>
