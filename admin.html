<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle Perfume | Admin Panel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="admin.css">
    <style>
        select.form-input { width: 100%; padding: 12px 15px; border: 1px solid var(--color-border, #EAEAEC); border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; background: white; cursor: pointer; }
        select.form-input:focus { border-color: #000; }
        .item-details-preview { font-size: 12px; color: #666; margin-top: 5px; line-height: 1.4; }
        .loading-text { font-size: 14px; color: #007bff; font-weight: 600; display: none; margin-top: 10px; }
        
        .edit-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 1000; }
        .edit-modal.active { opacity: 1; pointer-events: auto; }
        .edit-modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        .edit-modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: #666; }
        .edit-modal h3 { margin-top: 0; margin-bottom: 20px; font-size: 18px; font-weight: 700; }
        .edit-form-group { margin-bottom: 15px; }
        .edit-form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .edit-form-group input { width: 100%; padding: 10px; border: 1px solid #EAEAEC; border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
        .edit-form-group input:focus { border-color: #000; outline: none; }
        .btn-edit-action { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; margin-right: 5px; }
        .btn-edit-action:hover { background: #0056b3; }
        .item-actions { display: flex; flex-direction: column; gap: 5px; justify-content: center; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">Michelle <span>Admin</span></div>
        <ul class="admin-menu">
            <li><a href="#" class="tab-btn active" data-tab="slider-tab">Գլխավոր Սլայդեր</a></li>
            <li><a href="#" class="tab-btn" data-tab="products-tab">Ապրանքներ (Cards)</a></li>
            <li><a href="#" class="tab-btn" data-tab="orders-tab">Պատվերներ <span id="orders-badge" class="badge">0</span></a></li>
        </ul>
        <a href="index.html" class="back-to-site">← Դեպի կայք</a>
    </aside>

    <main class="admin-content">
        <div id="slider-tab" class="tab-content active">
            <header class="admin-header"><h1>Կառավարել Սլայդերը</h1></header>
            <div class="add-box">
                <input type="file" id="sliderFileInput" accept="image/*" style="padding: 8px;">
                <button id="addSliderBtn" class="btn-dark">Ավելացնել Սլայդերում</button>
            </div>
            <p id="sliderLoading" class="loading-text">Նկարը օպտիմալացվում և բեռնվում է...</p>
            <div class="grid-list" id="adminSliderList"></div>
        </div>

        <div id="products-tab" class="tab-content">
            <header class="admin-header"><h1>Ապրանքների Կատալոգ</h1></header>
            <div class="add-product-form">
                <h3>Ավելացնել նոր ապրանք</h3>
                <div class="form-group">
                    <input type="text" id="prodTitle" placeholder="Ապրանքի անվանումը...">
                    <input type="text" id="prodBrand" placeholder="Բրենդ...">
                </div>
                <div class="form-group">
                    <input type="number" id="prodMl" placeholder="Բազային ծավալ (մլ) օր.՝ 100" style="width: 50%;">
                    <input type="number" id="prodPrice" placeholder="Գին (AMD) օր.՝ 15000" style="width: 50%;">
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <input type="text" id="prodSizes" placeholder="Հնարավոր ծավալները ստորակետով՝ 30,45,100...">
                </div>
                <div class="form-group">
                    <select id="prodGender" class="form-input">
                        <option value="Unisex">Unisex</option>
                        <option value="Տղամարդու">Տղամարդու</option>
                        <option value="Կանացի">Կանացի</option>
                    </select>
                    <input type="file" id="prodFileInput" accept="image/*" style="padding: 8px;">
                </div>
                <button id="addProductBtn" class="btn-dark" style="margin-top: 15px;">Ավելացնել Կատալոգում</button>
                <p id="prodLoading" class="loading-text">4K նկարը օպտիմալացվում և բեռնվում է...</p>
            </div>
            <div class="grid-list" id="adminProductsList"></div>
        </div>

        <div id="orders-tab" class="tab-content">
            <header class="admin-header"><h1>Ստացված Պատվերներ</h1></header>
            <div class="orders-container" id="adminOrdersList"></div>
        </div>
    </main>

    <div class="edit-modal" id="editProductModal">
        <div class="edit-modal-content">
            <button class="edit-modal-close" id="closeEditModal">✕</button>
            <h3>Խմբագրել Ապրանքը</h3>
            <div class="edit-form-group">
                <label>Անվանում</label>
                <input type="text" id="editProdTitle">
            </div>
            <div class="edit-form-group">
                <label>Բրենդ</label>
                <input type="text" id="editProdBrand">
            </div>
            <div class="edit-form-group">
                <label>Հին Գին (AMD)</label>
                <input type="number" id="editProdPrice">
            </div>
            <div class="edit-form-group">
                <label>Նոր Գին / Զեղչ (AMD)</label>
                <input type="number" id="editProdSalePrice" placeholder="Թողնել դատարկ, եթե զեղչ չկա">
            </div>
            <button id="saveProductBtn" class="btn-dark" style="width: 100%; margin-top: 10px;">Պահպանել Փոփոխությունները</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDDIyOC18ezuMB1dnPaap9FohRGU62OsrY",
        authDomain: "michele-fcaf7.firebaseapp.com",
        projectId: "michele-fcaf7",
        storageBucket: "michele-fcaf7.firebasestorage.app",
        messagingSenderId: "94596268135",
        appId: "1:94596268135:web:fb84cda9f2e427199814c2",
        databaseURL: "https://michele-fcaf7-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let currentEditingKey = null;

    // ⚡ 4K ՆԿԱՐՆԵՐԻ ԱՎՏՈՄԱՏ ՓՈՔՐԱՑՈՒՄ ԲՐԱՈՒԶԵՐՈՒՄ
    function resizeAndCompressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // Եթե նկարը 4K է կամ շատ մեծ, բերում ենք վեբի համար մաքսիմալ 1080px-ի
                    const MAX_WIDTH = 1080;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Վերածում ենք թեթև WebP կամ JPEG ֆայլի (Որակը 85%)
                    canvas.toBlob((blob) => {
                        resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".webp", { type: "image/webp" }));
                    }, "image/webp", 0.85);
                };
            };
        });
    }

// 🚀 ԱՆԽՈՑԵԼԻ ՈՒ ՊԱՇՏՈՆԱԿԱՆ API ԲԵՌՆՈՒՄ (ԷԼ ՈՉ ՄԻ 401 ՍԽԱԼ ՉԻ ԼԻՆԻ)
    async function uploadImageToCloud(file) {
        // 1. Նախքան ուղարկելը 4K/2K նկարը ավտոմատ սեղմում ու թեթևացնում ենք
        const compressedFile = await resizeAndCompressImage(file);

        const formData = new FormData();
        formData.append("file", compressedFile);
        
        // Օգտագործում ենք պաշտոնական բաց հեղինակավորումը
        formData.append("api_key", "551221443657497"); 
        formData.append("upload_preset", "ml_default"); // Սա Cloudinary-ի ստանդարտ, հավերժական բաց պրեսետն է

        try {
            const response = await fetch("https://api.cloudinary.com/v1_1/regiscode/image/upload", {
                method: "POST",
                body: formData // Բրաուզերը ինքը ճիշտ կկազմի Content-Type-ը
            });

            if (!response.ok) {
                const errData = await response.json();
                console.error("Cloudinary Սերվերի Սխալը:", errData);
                throw new Error("Cloudinary-ն մերժեց հարցումը");
            }

            const result = await response.json();
            
            // Եթե բեռնումը հաջող է, վերցնում ենք անվտանգ HTTPS հղումը
            if (result && result.secure_url) {
                return result.secure_url; 
            } else {
                throw new Error("Սխալ պատասխան սերվերից");
            }
        } catch (error) {
            console.error("Բեռնման սխալ:", error);
            alert("Նկարը չբեռնվեց։ Փորձեք կրկին կամ ընտրեք ուրիշ նկար։");
            return null;
        }
    }

    // --- Սլայդերի կոդ ---
    const sliderRef = ref(db, 'slider');
    onValue(sliderRef, (snapshot) => {
        const data = snapshot.val() || {};
        const list = document.getElementById('adminSliderList');
        list.innerHTML = '';
        Object.keys(data).forEach(key => {
            const item = data[key];
            list.innerHTML += `<div class="item-card"><img src="${item.img}" width="80"><button class="btn-delete" id="del-s-${key}">Ջնջել</button></div>`;
        });
        Object.keys(data).forEach(key => {
            document.getElementById(`del-s-${key}`)?.addEventListener('click', () => remove(ref(db, `slider/${key}`)));
        });
    });

    document.getElementById('addSliderBtn').addEventListener('click', async () => {
        const file = document.getElementById('sliderFileInput').files[0];
        if(file) {
            document.getElementById('sliderLoading').style.display = 'block';
            const imgUrl = await uploadImageToCloud(file);
            if(imgUrl) {
                push(sliderRef, { img: imgUrl }).then(() => {
                    document.getElementById('sliderLoading').style.display = 'none';
                    document.getElementById('sliderFileInput').value = '';
                });
            } else { document.getElementById('sliderLoading').style.display = 'none'; }
        } else { alert('Ընտրիր սլայդերի նկարը։'); }
    });

    // --- Ապրանքների կոդ ---
    const productsRef = ref(db, 'products');
    onValue(productsRef, (snapshot) => {
        const data = snapshot.val() || {};
        const list = document.getElementById('adminProductsList');
        list.innerHTML = '';
        Object.keys(data).forEach(key => {
            const p = data[key];
            const sizesPreview = p.sizes ? p.sizes.join(', ') + ' մլ' : 'Չկա';
            const salePricePreview = p.salePrice ? `<span style="color: #ff3b30; font-weight:bold;"> / Նոր գին: ${p.salePrice} AMD</span>` : '';

            list.innerHTML += `
                <div class="item-card">
                    <img src="${p.img}" width="80" style="object-fit: cover; height: 80px; border-radius: 6px;">
                    <div class="item-info">
                        <h4>${p.title}</h4>
                        <p>${p.brand} [${p.gender || 'Unisex'}]</p>
                        <div class="item-details-preview"><b>Արժեք:</b> ${p.ml}մլ = ${p.price} AMD ${salePricePreview}</div>
                        <div class="item-details-preview"><b>Չափսերը:</b> ${sizesPreview}</div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-edit-action" id="edit-prod-${key}">Edit</button>
                        <button class="btn-delete" id="del-prod-${key}">Ջնջել</button>
                    </div>
                </div>`;
        });

        Object.keys(data).forEach(key => {
            document.getElementById(`del-prod-${key}`)?.addEventListener('click', () => remove(ref(db, `products/${key}`)));
            document.getElementById(`edit-prod-${key}`)?.addEventListener('click', () => {
                const p = data[key];
                currentEditingKey = key;
                document.getElementById('editProdTitle').value = p.title;
                document.getElementById('editProdBrand').value = p.brand;
                document.getElementById('editProdPrice').value = p.price;
                document.getElementById('editProdSalePrice').value = p.salePrice || '';
                document.getElementById('editProductModal').classList.add('active');
            });
        });
    });

    document.getElementById('saveProductBtn').addEventListener('click', () => {
        if (currentEditingKey) {
            const title = document.getElementById('editProdTitle').value.trim();
            const brand = document.getElementById('editProdBrand').value.trim();
            const price = document.getElementById('editProdPrice').value.trim();
            const salePriceRaw = document.getElementById('editProdSalePrice').value.trim();

            if (title && brand && price) {
                const salePrice = salePriceRaw !== "" ? Number(salePriceRaw) : "";
                update(ref(db, `products/${currentEditingKey}`), {
                    title, brand, price: Number(price), salePrice
                }).then(() => {
                    document.getElementById('editProductModal').classList.remove('active');
                    currentEditingKey = null;
                });
            }
        }
    });

    document.getElementById('closeEditModal').addEventListener('click', () => {
        document.getElementById('editProductModal').classList.remove('active');
        currentEditingKey = null;
    });

    document.getElementById('addProductBtn').addEventListener('click', async () => {
        const title = document.getElementById('prodTitle').value.trim();
        const brand = document.getElementById('prodBrand').value.trim();
        const ml = document.getElementById('prodMl').value.trim();
        const price = document.getElementById('prodPrice').value.trim();
        const sizesRaw = document.getElementById('prodSizes').value.trim();
        const gender = document.getElementById('prodGender').value;
        const file = document.getElementById('prodFileInput').files[0];

        if(title && brand && ml && price && sizesRaw && file) {
            document.getElementById('prodLoading').style.display = 'block';
            const imgUrl = await uploadImageToCloud(file);
            
            if(imgUrl) {
                const sizesArray = sizesRaw.split(',').map(s => Number(s.trim())).filter(s => !isNaN(s) && s > 0);
                push(productsRef, { 
                    title, brand, ml: Number(ml), price: Number(price), salePrice: "", sizes: sizesArray, gender, img: imgUrl 
                }).then(() => {
                    document.getElementById('prodLoading').style.display = 'none';
                    document.getElementById('prodTitle').value = '';
                    document.getElementById('prodBrand').value = '';
                    document.getElementById('prodMl').value = '';
                    document.getElementById('prodPrice').value = '';
                    document.getElementById('prodSizes').value = '';
                    document.getElementById('prodFileInput').value = '';
                });
            } else { document.getElementById('prodLoading').style.display = 'none'; }
        } else { alert('Լրացրու բոլոր դաշտերը!'); }
    });

    // --- Պատվերներ ---
    const ordersRef = ref(db, 'orders');
    onValue(ordersRef, (snapshot) => {
        const data = snapshot.val() || {};
        const list = document.getElementById('adminOrdersList');
        document.getElementById('orders-badge').innerText = Object.keys(data).length;
        list.innerHTML = '';
        Object.keys(data).forEach(key => {
            const o = data[key];
            list.innerHTML += `
                <div class="order-card" style="border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #fff;">
                    <p style="margin: 0 0 5px 0;"><b>Հաճախորդ:</b> ${o.name} (${o.phone})</p>
                    <p style="margin: 0 0 5px 0; color: #555;"><b>Պատվեր:</b> ${o.items}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <b style="color: #000; font-size: 16px;">${o.total} AMD</b>
                        <button class="btn-complete" id="del-o-${key}" style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Ավարտել</button>
                    </div>
                </div>`;
        });
        Object.keys(data).forEach(key => {
            document.getElementById(`del-o-${key}`)?.addEventListener('click', () => remove(ref(db, `orders/${key}`)));
        });
    });

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });
</script>
</body>
</html>
